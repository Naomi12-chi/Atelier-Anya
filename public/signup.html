<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Create Account | Atelier Anya</title>
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <main class="signup-page">
        <div class="signup-container">
            <div class="signup-brand">
                <a href="index.html" class="signup-logo">
                    ATELIER ANYA
                </a>
                <div class="signup-brand-content">
                    <span>
                        WELCOME TO ATELIER ANYA
                    </span>
                    <h1>
                        Your beauty, your confidence, your story.
                    </h1>
                    <p>
                        Create an account and discover
                        a beauty experience curated just
                        for you.
                    </p>
                </div>
            </div>
            <div class="signup-form-container">
                <div class="signup-header">
                     <h2>Create Your Account</h2>
                    <p>
                        Join Atelier Anya and start your
                        beauty journey.
                    </p>

                </div>


                <form id="signupForm">


                    <!-- FIRST NAME -->

                    <!-- <div class="form-group">

                        <label for="firstName">
                            First Name
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-regular fa-user"></i>

                            <input
                                type="text"
                                id="firstName"
                                placeholder="Enter your first name"
                                required
                            >

                        </div> -->

                    <!-- </div> -->



                    <!-- LAST NAME -->

                    <div class="form-group">

                        <label for="FullName">
                            Full Name
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-regular fa-user"></i>

                            <input
                                type="text"
                                id="fullName"
                                placeholder="Enter your full name"
                            >

                        </div>

                    </div>



                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="signupEmail">
                            Email Address
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-regular fa-envelope"></i>

                            <input
                                type="email"
                                id="email"
                                placeholder="Enter your email"
                                required
                            >

                        </div>

                    </div>



                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="signupPassword">
                            Password
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="password"
                                placeholder="Create a password"
                                required
                            >

                            <button
                                type="button"
                                class="toggle-password"
                                id="togglePassword"
                                aria-label="Show password"
                            >
                                <i class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <!-- <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm your password"
                                required
                            >

                            <button
                                type="button"
                                class="toggle-password"
                                id="toggleConfirmPassword"
                                aria-label="Show password"
                            >

                                <i class="fa-regular fa-eye"></i>

                            </button>

                        </div> -->

                    </div>



                    <!-- TERMS -->

                    <div class="terms-group">

                        <label>

                            <input
                                type="checkbox"
                                id="terms"
                                required
                            >

                            <span>
                                I agree to the
                                <a href="#">
                                    Terms & Conditions
                                </a>
                                and
                                <a href="#">
                                    Privacy Policy
                                </a>.
                            </span>

                        </label>

                    </div>



                    <!-- MESSAGE -->

                    <p
                        class="signup-message"
                        id="signupMessage"
                    ></p>



                    <!-- SUBMIT -->

                    <button
                        type="submit"
                        class="signup-btn"
                    >

                        Create Account

                        <i class="fa-solid fa-arrow-right"></i>

                    </button>

                </form>



                <!-- LOGIN LINK -->

                <div class="login-link">

                    <p>
                        Already have an account?
                    </p>

                    <a href="login.html">
                        Sign In
                    </a>

                </div>
                <a
                    href="index.html"
                    class="back-to-store">
                    <i class="fa-solid fa-arrow-left"></i>

                    Continue Shopping
                </a>
            </div>
        </div>
    </main>
    <script src="auth.js"></script>
    <script src="signup.js"></script>
   
</body>
</html>
