<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Atelier Anya</title>

    <link rel="stylesheet" href="signup.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

    <main class="login-page">

        <div class="login-container">

            <!-- BRAND -->

            <div class="login-brand">
                <a href="index.html">
                    <h1>ATELIER ANYA</h1>
                </a>

                <p>Welcome back</p>
            </div>


            <!-- LOGIN FORM -->

            <form id="loginForm" class="login-form">

                <h2>Login to your account</h2>

                <p class="login-intro">
                    Sign in to continue shopping with Atelier Anya.
                </p>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            id="toggleLoginPassword"
                            aria-label="Show password"
                        >
                            <i class="fa-regular fa-eye"></i>
                        </button>

                    </div>
                   
                </div>


                <!-- OPTIONS -->

                <div class="login-options">

                    <label class="remember-me">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        <span>Remember me</span>

                    </label>

                    <a href="#" class="forgot-password">
                        Forgot password?
                    </a>

                </div>


                <!-- MESSAGE -->

                <p
                    id="loginMessage"
                    class="login-message"
                ></p>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>


                <!-- SIGNUP -->

                <p class="signup-link">

                    Don't have an account?

                    <a href="signup.html">
                        Create one
                    </a>

                </p>


            </form>


            <!-- GUEST BROWSING -->

            <div class="guest-browsing">

                <span>or</span>

                <a href="index.html">
                    Continue as Guest
                </a>

            </div>

        </div>

    </main>


    <script src="auth.js"></script>
    <script src="login.js"></script>

</body>

</html>
